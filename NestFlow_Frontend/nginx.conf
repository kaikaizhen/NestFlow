server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：找不到實體檔案時一律回傳 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理掛在子路徑（docker-compose.prod.yml 建置時的 /nestflow/）時，
    # 實體檔案仍在映像的根目錄，用 alias 對應回去，直接執行時不會用到這個 location。
    location /nestflow/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /nestflow/index.html;
    }

    # Service Worker 不快取，確保能取得新版本
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
}
