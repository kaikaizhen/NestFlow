server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：找不到實體檔案時一律回傳 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service Worker 不快取，確保能取得新版本
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
}
