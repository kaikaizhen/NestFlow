services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nestflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - nestflow-mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ./NestFlow_Backend
      dockerfile: NestFlow_Backend/Dockerfile
    container_name: nestflow-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # 機密值一律由 .env 注入，不寫死於 compose 檔
      ConnectionStrings__NestFlowDb: "Server=sqlserver,1433;Database=NestFlow;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Encryption__Key: ${ENCRYPTION_KEY}
      # 預設值皆為「直接執行、不經反向代理」。部署在反向代理後面時，
      # 在 .env 填對應變數即可覆蓋，不需要另一份 compose 檔。
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1:-}
      # 本機以 HTTP 測試，正式部署經 HTTPS 反向代理時在 .env 設為 true
      Session__RequireHttps: ${SESSION_REQUIRE_HTTPS:-false}
      # 讓 ASP.NET Core 接受反向代理傳入的 X-Forwarded-* 標頭，直接執行時不需要
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: ${FORWARDED_HEADERS_ENABLED:-false}
      LineLogin__ChannelId: ${LINE_CHANNEL_ID:-}
      LineLogin__ChannelSecret: ${LINE_CHANNEL_SECRET:-}
      LineLogin__CallbackUrl: ${LINE_LOGIN_CALLBACK_URL:-http://localhost:8080/api/auth/line/callback}
      LineLogin__FrontendRedirectUrl: ${LINE_LOGIN_FRONTEND_REDIRECT_URL:-http://localhost:5173/}
      # Messaging API Channel（未設定時 Webhook 停用，可改用 /api/dev/line 模擬端點）
      LineMessaging__ChannelId: ${LINE_MESSAGING_CHANNEL_ID:-}
      LineMessaging__ChannelSecret: ${LINE_MESSAGING_CHANNEL_SECRET:-}
      LineMessaging__ChannelAccessToken: ${LINE_MESSAGING_ACCESS_TOKEN:-}
      # Dify Workflow：固定格式解析不出結果時的自然語言後援，未設定時直接回覆既有用法提示
      Dify__BaseUrl: ${DIFY_BASE_URL:-}
      Dify__AppKey: ${DIFY_APP_KEY:-}
      # Observability：trace 以 OTLP HTTP 送往 Tempo；log 只寫 stdout，由 Docker + Alloy 送入 Loki，
      # 應用程式不連 Loki。ENABLE_OPEN_TELEMETRY / OTEL_* 由 .env 注入，endpoint 留空則不建立 exporter。
      Library__Observability__Enabled: ${ENABLE_OPEN_TELEMETRY:-true}
      Library__Observability__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      Library__Observability__ServiceName: ${OTEL_SERVICE_NAME:-nestflow-api}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./NestFlow_Backend
      dockerfile: NestFlow_Worker/Dockerfile
    container_name: nestflow-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      # 提醒 Worker 直接讀寫資料庫並呼叫 LINE Push，設定鍵名與 API 相同
      ConnectionStrings__NestFlowDb: "Server=sqlserver,1433;Database=NestFlow;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Encryption__Key: ${ENCRYPTION_KEY}
      LineMessaging__ChannelId: ${LINE_MESSAGING_CHANNEL_ID:-}
      LineMessaging__ChannelSecret: ${LINE_MESSAGING_CHANNEL_SECRET:-}
      LineMessaging__ChannelAccessToken: ${LINE_MESSAGING_ACCESS_TOKEN:-}
      # Observability：trace 以 OTLP HTTP 送往 Tempo；log 只寫 stdout，由 Docker + Alloy 送入 Loki，
      # 應用程式不連 Loki。ENABLE_OPEN_TELEMETRY / OTEL_* 由 .env 注入，endpoint 留空則不建立 exporter。
      Library__Observability__Enabled: ${ENABLE_OPEN_TELEMETRY:-true}
      Library__Observability__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      Library__Observability__ServiceName: ${OTEL_WORKER_SERVICE_NAME:-nestflow-worker}
    depends_on:
      sqlserver:
        condition: service_healthy

  pwa:
    build:
      context: ./NestFlow_Frontend
      args:
        # 瀏覽器實際呼叫的 API 位址，反向代理子路徑部署時在 .env 覆蓋
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        # 部署子路徑，直接執行預設為根路徑；掛在反向代理子路徑時在 .env 改成例如 /nestflow/
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    container_name: nestflow-pwa
    ports:
      - "${PWA_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  nestflow-mssql-data:
