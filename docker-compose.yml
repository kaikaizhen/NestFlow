services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nestflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - nestflow-mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ./NestFlow_Backend
      dockerfile: NestFlow_Backend/Dockerfile
    container_name: nestflow-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # 機密值一律由 .env 注入，不寫死於 compose 檔
      ConnectionStrings__NestFlowDb: "Server=sqlserver,1433;Database=NestFlow;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Encryption__Key: ${ENCRYPTION_KEY}
      Cors__AllowedOrigins__0: "http://localhost:5173"
      # 本機以 HTTP 測試，正式部署改為 true
      Session__RequireHttps: "false"
      LineLogin__ChannelId: ${LINE_CHANNEL_ID:-}
      LineLogin__ChannelSecret: ${LINE_CHANNEL_SECRET:-}
      LineLogin__CallbackUrl: "http://localhost:8080/api/auth/line/callback"
      LineLogin__FrontendRedirectUrl: "http://localhost:5173/"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./NestFlow_Backend
      dockerfile: NestFlow_Worker/Dockerfile
    container_name: nestflow-worker
    environment:
      DOTNET_ENVIRONMENT: Development
    depends_on:
      sqlserver:
        condition: service_healthy

  pwa:
    build:
      context: ./NestFlow_Frontend
      args:
        VITE_API_BASE_URL: "http://localhost:8080"
    container_name: nestflow-pwa
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  nestflow-mssql-data:
